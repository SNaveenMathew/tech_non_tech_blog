<nav class="pager" aria-label="More articles">
  {%- if page.previous.url %}
  <a class="pager-link pager-prev" href="{{ page.previous.url | relative_url }}" rel="prev">
    <span class="pager-label">Previous post</span>
    <span class="pager-title">{{ page.previous.title | escape }}</span>
  </a>
  {%- endif %}
  {%- if page.next.url %}
  <a class="pager-link pager-next" href="{{ page.next.url | relative_url }}" rel="next">
    <span class="pager-label">Next post</span>
    <span class="pager-title">{{ page.next.title | escape }}</span>
  </a>
  {%- endif %}
</nav>
